# BLUE DEPLOYMENT - Stable version
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering
      version: blue
  template:
    metadata:
      labels:
        app: food-ordering
        version: blue
    spec:
      containers:
        - name: food-ordering
          image: archanajawahar14/food-ordering:stable
          ports:
            - containerPort: 80

---
# BLUE SERVICE
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-blue-svc
spec:
  type: ClusterIP
  selector:
    app: food-ordering
    version: blue
  ports:
    - port: 80
      targetPort: 80

---
# GREEN DEPLOYMENT - Updated version
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-ordering-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-ordering
      version: green
  template:
    metadata:
      labels:
        app: food-ordering
        version: green
    spec:
      containers:
        - name: food-ordering
          image: archanajawahar14/food-ordering:green
          ports:
            - containerPort: 80

---
# GREEN SERVICE
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-green-svc
spec:
  type: ClusterIP
  selector:
    app: food-ordering
    version: green
  ports:
    - port: 80
      targetPort: 80

---
# ACTIVE SERVICE - Initially routes traffic to BLUE
apiVersion: v1
kind: Service
metadata:
  name: food-ordering-active
spec:
  type: NodePort
  selector:
    app: food-ordering
    version: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30022
